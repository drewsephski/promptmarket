schemaVersion: 1

name: github-pr-review
version: 0.2.0

author:
  name: PromptMarket
  url: https://github.com/drewsephski/promptmarket/tree/main/recipes/github-pr-review/0.2.0

compatibility:
  - cursor
  - claude-code
  - codex
  - generic

requires:
  mcp:
    - io.github.github/github-mcp-server

capabilities:
  filesystem: read
  network:
    - github.com
  shell: false

entrypoint: SKILL.md

tags:
  - github
  - pull-request
  - code-review
